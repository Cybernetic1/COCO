<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Hierarchy Map</title>
  <style>
    body {
      background: #f7fafd;
      font-family: sans-serif;
    }
    h1, h2 {
	  color: #000;
	}
    .map-node {
      display: inline-block;
      margin: 0.5em;
      padding: 0.5em 1em;
      background: #fff8e1;
      border: 3px solid #CCC;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
    }
    .map-node:hover {
      border: 3px solid #555;
      /* background: #fee !important; */
    }
    .map-children {
      margin-left: 2em;
      display: block;
    }
    #node-modal {
      display: none;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border: 2px solid #CCC;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.15);
      padding: 2em 2em 1.5em 2em;
      z-index: 1000;
      min-width: 300px;
    }
    #node-modal input {
      width: 90%;
      margin-bottom: 1em;
      padding: 0.4em;
      border-radius: 6px;
      border: 1px solid #CCC;
    }
    #modal-overlay {
      display: none;
      position: fixed;
      left: 0; top: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.2);
      z-index: 999;
    }
    .menu-item {
      padding: 8px 16px;
      cursor: pointer;
      font-size: 15px;
      border-bottom: 1px solid #eee;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:hover { background: #f0f0f0; }
    
    /* Slider styles for percentage voting */
    .slider-container {
      margin-top: 5px;
      width: 100%;
      max-width: 300px;
    }
    
    .slidecontainer {
      width: 100%;
      height: 30px;
      margin-bottom: 3px;
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type='range'] {
      appearance: none;
      -webkit-appearance: none;
      background-color: #AAA;
      height: 20px;
      overflow: hidden;
    }
    input[type='range']::-webkit-slider-runnable-track {
      -webkit-appearance: none;
      background: yellow;
      height: 20px;
    }
    input[type="range"]::-moz-range-progress {
      background-color: yellow;
      height: 20px
    }
    input[type='range']::-moz-range-thumb {
      background: #fff;
      cursor: pointer;
      height: 20px;
      border: 0;
      border-radius: 0%;
    }
    
    .slider {
      position: absolute;
      left: 0;
      right: 40px; /* Leave space for score */
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.6;
      z-index: 1;
    }

    .slider::-webkit-slider-runnable-track{
      height: 20px; /* Adjust the track height */
    }

    .slider-name {
      position: relative;
      z-index: 2;
      color: #333;
      font-size: 12px;
      font-weight: bold;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
      flex: 1;
      padding: 0 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none; /* Allow clicks to pass through to slider */
    }

    .slider-score {
      position: relative;
      z-index: 2;
      font-size: 11px;
      color: #333;
      font-weight: bold;
      width: 35px;
      text-align: right;
      background: rgba(255,255,255,0.5);
      padding: 2px;
      border-radius: 2px;
    }
    
    .slider-total {
      display: none; /* Hide total row to save space */
      margin-top: 2px;
      font-size: 11px;
      color: #AAA;
      font-weight: bold;
    }
  </style>
  <script src="js/percentage-manager.js"></script>
  <script src="js/project-map.js" defer></script>
</head>
<body>
  <div style="display:flex; align-items:center; justify-content:space-between; margin-top:1.5em; margin-bottom:0.5em;">
    <div style="display:flex; align-items:center; gap:1em;">
      <span style="color:#AAA; font-size:16px; font-weight:normal;">Project Map:</span>
      <h1 style="text-align:left; margin:0;">Project Name</h1>
    </div>
    <!--div style="float:left;"><h2>Project Map</h2></div-->
    <div style="background-color:White; z-index:9;">
      <div style="position:relative; display:inline-block;">
        <button id="menuButton" onclick="toggleMenuDropdown()" style="font-size:22px; padding:4px 10px; border-radius:6px; background:#fff; border:1.5px solid #888;">
          <span style="display:inline-block; font-size:22px; line-height:1;">&#9776;</span>
        </button>
        <div id="menuDropdown" style="display:none; position:absolute; right:0; top:36px; background:#fff; border:1px solid #888; border-radius:6px; min-width:200px; box-shadow:0 2px 8px #888; z-index:100;">
          <div class="menu-item" onclick="editProjectName(); hideMenuDropdown();">Edit Project Name</div>
          <div class="menu-item" onclick="switchLang(); hideMenuDropdown();">Switch Language</div>
          <div class="menu-item" onclick="readJSONMap(); hideMenuDropdown();">Read JSON map</div>
          <div class="menu-item" onclick="saveJSONMap(); hideMenuDropdown();">Save JSON map</div>
          <div class="menu-item" onclick="saveAllPercentages(); hideMenuDropdown();">💾 Save Percentages</div>
        </div>
      </div>
    </div>
  </div>
  <div id="map-container" style="margin:2em auto;max-width:900px;"></div>
  <hr style="width:95%;margin:2.5% auto 1.2em auto;border:0;border-top:2px solid #000; margin-top:4em;">
  <div id="page-chat" style="width:95%;margin:0 auto 0 auto;">
    <h3 style="color:#AAA;margin-top:0;margin-bottom:0.7em;">Page Chat</h3>
    <div id="chat-messages" style="min-height:120px;max-height:220px;overflow-y:auto;margin-bottom:1em;background:#fff;border-radius:0;padding:0.7em 1em;border:1px solid #CCC;"></div>
    <form id="chat-form" style="display:flex;gap:0.5em;">
      <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" style="flex:1;padding:0.5em;border-radius:6px;border:1px solid #CCC;">
      <button type="submit" style="background:#999;color:#fff;border:none;border-radius:6px;padding:0.5em 1.2em;font-weight:bold;">Send</button>
    </form>
  </div>
  <div id="modal-overlay"></div>
  <div id="node-modal">
    <h2>Edit Node</h2>
    <label>Label:<br><input id="modal-node-label" type="text"></label><br>
    <button id="modal-save-btn">Save</button>
    <button id="modal-cancel-btn">Cancel</button>
  </div>
  <script>
    function toggleMenuDropdown() {
      var d = document.getElementById('menuDropdown');
      d.style.display = (d.style.display === 'block') ? 'none' : 'block';
    }
    function hideMenuDropdown() {
      document.getElementById('menuDropdown').style.display = 'none';
    }
    // Hide dropdown if clicking outside
    window.addEventListener('mousedown', function(e) {
      var menu = document.getElementById('menuDropdown');
      var btn = document.getElementById('menuButton');
      if (menu && btn && !menu.contains(e.target) && !btn.contains(e.target)) {
        menu.style.display = 'none';
      }
    });
  </script>
</body>
</html>
