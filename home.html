<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Matrix Rain Home</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      /* background: #a3e4f5; */
      /* background: #d8f7ff; */
      overflow: hidden;
    }
    body {
      width: 100vw;
      height: 100vh;
      /* Add a background image container */
    }
    #bg-svg {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      user-select: none;
      display: block;
    }
    svg {
      display: block;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0; left: 0;
    }
    #foreground-text {
      position: absolute;
      top: 50%;
      left: 0;
      width: 100vw;
      text-align: center;
      font-size: 4em;
      font-weight: bold;
      color: #fff;
      /* Multi-layered, visible, sophisticated drop shadow for light background */
      text-shadow:
        0 2px 8px #00e0ff,
        0 0 2px #00e0ff,
        0 4px 16px #000a,
        0 8px 32px #000a,
        2px 2px 8px #000a,
        -2px 2px 8px #000a;
      pointer-events: none;
      user-select: none;
      transform: translateY(-50%);
    }
    #bg-img {
      position: fixed;
      top: 0;
      left: 0;
      min-width: 100vw;
      min-height: 100vh;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <img id="bg-img" src="images/cyan-background.jpg" alt="background" />
  <svg id="bg-svg"></svg>
  <div id="foreground-text">
    我們的目標是<br>
    建立未來世界的民主<br>
    和人工智能服務<br>
    消除種族歧視和極權主義<br>
    我們相信人類的未來<br>
    是自由、平等和尊重的
  </div>
  <svg id="matrix-svg"></svg>
  <script>
    // Famous science fiction quotes
    const sciFiQuotes = [

];

    const svg = document.getElementById('matrix-svg');
    let width = window.innerWidth;
    let height = window.innerHeight;
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);

    // Fewer sentences for sparser effect
    const minFontSize = 20;
    const maxFontSize = 42;
    const numSentences = Math.floor(width / (minFontSize * 4));
    // Each drop is an object: { x, y, quoteIdx, speed, fontSize }
    let drops = [];
    function randomColor() {
      // Generate a color in white, grey, or light blue tones
      const palette = [
        '#baffc9', // light blue-green
        '#e0f7fa', // very light blue
        '#f0f8ff', // alice blue
        '#e3e3e3', // light grey
        '#ffffff', // white
        '#d0e6f7', // light blue
        '#cfd8dc', // blue-grey
        '#f5fafd', // almost white
        '#eaf6fb', // very pale blue
        '#e6ecf0'  // pale grey
      ];
      return palette[Math.floor(Math.random() * palette.length)];
    }
    function initDrops() {
      drops = [];
      for (let i = 0; i < numSentences; i++) {
        const x = Math.random() * (width - maxFontSize * 2);
        const y = Math.random() * height - Math.random() * height;
        const quoteIdx = Math.floor(Math.random() * sciFiQuotes.length);
        // Assign font size randomly in range
        const fontSize = minFontSize + Math.random() * (maxFontSize - minFontSize);
        // Make speed inversely proportional to font size (bigger text flows slower)
        // You can tweak the multiplier for desired effect
        const speed = 0 + (maxFontSize - fontSize) * 0.25;
        const color = randomColor();
        drops.push({ x, y, quoteIdx, speed, fontSize, color });
      }
    }
    initDrops();

    function isAsian(text) {
      // Returns true if the text contains CJK characters
      return /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uff00-\uffef]/.test(text);
    }

    function draw() {
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      for (let i = 0; i < drops.length; i++) {
        const drop = drops[i];
        const quote = sciFiQuotes[drop.quoteIdx];
        if (!isAsian(quote)) {
          // English: rotate 90deg, flow vertically
          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', drop.x);
          text.setAttribute('y', drop.y);
          text.setAttribute('font-size', drop.fontSize);
          text.setAttribute('fill', drop.color);
          text.setAttribute('font-family', 'monospace');
          text.setAttribute('transform', `rotate(90 ${drop.x} ${drop.y})`);
          text.textContent = quote;
          svg.appendChild(text);
        } else {
          // Asian: render vertically, upright characters, flow vertically
          for (let j = 0; j < quote.length; j++) {
            const ch = quote[j];
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', drop.x);
            text.setAttribute('y', drop.y + j * drop.fontSize);
            text.setAttribute('font-size', drop.fontSize);
            text.setAttribute('fill', drop.color);
            text.setAttribute('font-family', 'monospace');
            text.textContent = ch;
            svg.appendChild(text);
          }
        }
        drop.y += drop.speed;
        // For Asian, estimate height as fontSize * quote.length
        // For English, just use fontSize
        const quoteHeight = isAsian(quote) ? drop.fontSize * quote.length : drop.fontSize;
        if (drop.y - quoteHeight > height) {
          drop.x = Math.random() * (width - maxFontSize * 2);
          drop.y = -Math.random() * height;
          drop.quoteIdx = Math.floor(Math.random() * sciFiQuotes.length);
          // Assign font size randomly in range
          drop.fontSize = minFontSize + Math.random() * (maxFontSize - minFontSize);
          // Make speed inversely proportional to font size (bigger text flows slower)
          drop.speed = 3 + (maxFontSize * 1.5 - drop.fontSize) * 0.25 + Math.random() * 2;
          drop.color = randomColor();
        }
      }
    }

    setInterval(draw, 50);

    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
      initDrops();
    });

    // Fetch and extract sentences from sci-fi-texts/ files
    async function fetchSentences(file, lang) {
      const response = await fetch(`sci-fi-texts/${file}`);
      const text = await response.text();
      // Each line is a sentence; filter out empty lines
      return text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    }

    // --- Dynamically load and randomize sci-fi sentences from all files in sci-fi-texts/ ---
    async function getAllSciFiTextFiles() {
      // Hardcoded list based on your directory (update as needed)
      return [
        '1984.txt',
        '衛斯理 頭髮.txt',
        'わたしを離さないで.txt',
        'Neuromancer.txt',
        'Do_Androids_Dream_of_Electric_Sheep.txt',
        // 'HG Wells - War of the Worlds.txt'
        // Add more filenames here as you add them to sci-fi-texts/
      ];
    }

    async function loadSciFiQuotes() {
      const files = await getAllSciFiTextFiles();
      // Shuffle the files array for randomness
      for (let i = files.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [files[i], files[j]] = [files[j], files[i]];
      }
      let allSentences = [];
      for (const file of files) {
        let lang = 'english';
        if (/\.txt$/.test(file)) {
          if (/^[\u4e00-\u9fff]/.test(file) || file.includes('衛斯理')) lang = 'chinese';
          else if (/^[\u3040-\u30ff]/.test(file) || file.includes('わたし')) lang = 'japanese';
        }
        const sentences = await fetchSentences(file, lang);
        allSentences.push(...sentences);
      }
      // Shuffle all sentences for randomness
      for (let i = allSentences.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allSentences[i], allSentences[j]] = [allSentences[j], allSentences[i]];
      }
      sciFiQuotes.length = 0;
      sciFiQuotes.push(...allSentences);
      initDrops();
    }

    loadSciFiQuotes();
  </script>
  <audio id="bg-music" loop style="display:none">
    <source src="sounds/futuristic.ogg" type="audio/ogg">
    <source src="sounds/futuristic.aiff" type="audio/aiff">
    Your browser does not support the audio element.
  </audio>
  <script>
  // --- Play background music file after user interaction ---
  const audio = document.getElementById('bg-music');
  function startMusicOnce() {
    audio.play();
    window.removeEventListener('click', startMusicOnce);
  }
  window.addEventListener('click', startMusicOnce);
  
    // --- Generate minimalistic cyan SVG background ---
  function randomCyanShade(alpha=1) {
    // Return a random cyan/blue shade
    const c = 200 + Math.floor(Math.random()*55);
    const g = 255;
    const b = 255 - Math.floor(Math.random()*60);
    return `rgba(${c},${g},${b},${alpha})`;
  }
  
  function drawMinimalCyanBG() {
    const svg = document.getElementById('bg-svg');
    svg.innerHTML = '';
    const w = window.innerWidth;
    const h = window.innerHeight;
    svg.setAttribute('width', w);
    svg.setAttribute('height', h);
    // Draw random curves
    for (let i=0; i<6; ++i) {
      const path = document.createElementNS('http://www.w3.org/2000/svg','path');
      const x0 = Math.random()*w, y0 = Math.random()*h;
      const x1 = Math.random()*w, y1 = Math.random()*h;
      const x2 = Math.random()*w, y2 = Math.random()*h;
      const x3 = Math.random()*w, y3 = Math.random()*h;
      path.setAttribute('d', `M${x0},${y0} C${x1},${y1} ${x2},${y2} ${x3},${y3}`);
      path.setAttribute('stroke', randomCyanShade(0.18+0.12*Math.random()));
      path.setAttribute('stroke-width', 2+Math.random()*8);
      path.setAttribute('fill', 'none');
      svg.appendChild(path);
    }
    // Draw random straight lines
    for (let i=0; i<8; ++i) {
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1', Math.random()*w);
      line.setAttribute('y1', Math.random()*h);
      line.setAttribute('x2', Math.random()*w);
      line.setAttribute('y2', Math.random()*h);
      line.setAttribute('stroke', randomCyanShade(0.10+0.15*Math.random()));
      line.setAttribute('stroke-width', 1+Math.random()*5);
      svg.appendChild(line);
    }
    // Add a few soft radial gradients as glowing spots
    for (let i=0; i<3; ++i) {
      const cx = Math.random()*w, cy = Math.random()*h, r = 120+Math.random()*180;
      const gradId = `radial${i}`;
      const defs = svg.querySelector('defs') || svg.insertBefore(document.createElementNS('http://www.w3.org/2000/svg','defs'), svg.firstChild);
      const grad = document.createElementNS('http://www.w3.org/2000/svg','radialGradient');
      grad.setAttribute('id', gradId);
      grad.setAttribute('cx', '50%');
      grad.setAttribute('cy', '50%');
      grad.setAttribute('r', '50%');
      grad.innerHTML = `<stop offset='0%' stop-color='${randomCyanShade(0.18)}'/><stop offset='100%' stop-color='${randomCyanShade(0)}'/>`;
      defs.appendChild(grad);
      const circ = document.createElementNS('http://www.w3.org/2000/svg','circle');
      circ.setAttribute('cx', cx);
      circ.setAttribute('cy', cy);
      circ.setAttribute('r', r);
      circ.setAttribute('fill', `url(#${gradId})`);
      svg.appendChild(circ);
    }
  }
  // drawMinimalCyanBG();
  // window.addEventListener('resize', drawMinimalCyanBG);
  </script>
  <script>
    // --- Rotate and stretch background image based on aspect ratio ---
    function updateBgRotation() {
      const bg = document.getElementById('bg-img');
      if (!bg) return;
      if (window.innerWidth > window.innerHeight) {
        // Landscape: no rotation, stretch to fill
        bg.style.transform = 'rotate(0deg)';
        bg.style.width = '100vw';
        bg.style.height = '100vh';
      } else {
        // Portrait: rotate 90deg, stretch to fill
        bg.style.transform = 'rotate(90deg)';
        // After rotation, swap width/height to fill viewport
        bg.style.width = '100vh';
        bg.style.height = '100vw';
      }
      bg.style.objectFit = 'cover';
      bg.style.position = 'fixed';
      bg.style.top = '0';
      bg.style.left = '0';
      bg.style.zIndex = '-1';
      bg.style.pointerEvents = 'none';
      bg.style.userSelect = 'none';
    }
    window.addEventListener('resize', updateBgRotation);
    updateBgRotation();
  </script>
</body>
</html>
