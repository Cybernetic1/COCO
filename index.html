<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Matrix Rain Home</title>
  <style>
    @font-face {
    font-family: 'Alimama';
    src: url('css/阿里妈妈东方大楷.ttf');
    }
    html, body {
      height: 100%;
      margin: 0;
      /* background: #a3e4f5; */
      background: #fff;
      /* overflow: hidden; */ /* Remove this to prevent SVG clipping */
    }
    html {
      text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    }
    body {
      width: 100vw;
      height: 100vh;
      /* Add a background image container */
    }
    #foreground-text {
      position: absolute;
      top: 30%;
      left: 0;
      width: 100vw;
      text-align: center;
      font-size: 4em;
      font-weight: bold;
      color: #fff;
      /* Multi-layered, visible, sophisticated drop shadow for light background */
      text-shadow:
        0 2px 8px #00e0ff,
        0 0 2px #00e0ff,
        0 4px 16px #000a,
        0 8px 32px #000a,
        2px 2px 8px #000a,
        -2px 2px 8px #000a;
      pointer-events: auto;
      user-select: text;
      transform: translateY(-50%);
      z-index: 20;
    }
    #TRON-bike {
		display: block;
		margin-left: auto;
		margin-right: auto;
		margin-top: 80%;
		width: 90%;
	}

	/* Landscape adjustments */
	body.landscape #foreground-text {
		position: absolute;
		top: 50%;
		right: 5vw;
		left: auto;
		width: max-content;
		min-width: 40vw;
		max-width: 90vw;
		text-align: right !important;
		margin: 0;
		font-size: min(3.5em, 3.6vw) !important;
		white-space: nowrap; /* Prevent wrapping */
		z-index: 20;
		transform: translateY(-50%);
	}
	body.landscape #TRON-bike {
		position: absolute;
		left: 5vw;
		top: 50%;
		width: 40vw;
		max-width: 48vw;
		height: auto;
		margin: 0;
		z-index: 1;
		transform: translateY(-50%);
		display: block;
	}
	/* Ensure matrix-svg is below foreground text, as before */
	#matrix-svg {
      z-index: 10;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      user-select: none;
      display: block;
    }
  </style>
</head>
<body>
  <button id="lang-switch" style="position:fixed;top:16px;left:16px;z-index:10;font-size:1.2em;padding:0.4em 1em;border-radius:8px;border:none;background:#e0f7fa;color:#222;box-shadow:0 2px 8px #00e0ff;cursor:pointer;">English</button>
  <div id="foreground-text"></div>
  <img id="TRON-bike" src="images/TRON.jpg" alt="TRON" style="opacity:0.1;">
  <svg id="matrix-svg"></svg>

  <script>
    // Famous science fiction quotes
    const sciFiQuotes = [
	];

    const svg = document.getElementById('matrix-svg');
    let width = window.innerWidth;
    let height = window.innerHeight;
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);

    // --- DENSITY LOGIC: Denser in landscape, normal in portrait ---
    function getNumSentences() {
      const minFontSize = 20;
      if (document.body.classList.contains('landscape')) {
        return Math.floor(width / (minFontSize * 2.2)); // Denser in landscape
      } else {
        return Math.floor(width / (minFontSize * 4)); // Original in portrait
      }
    }
    let minFontSize = 20;
    let maxFontSize = 42;
    let numSentences = getNumSentences();
    let drops = [];
    function randomColor() {
      // Generate a color in white, grey, or light blue tones
      const palette = [
        'rgba(0, 0, 255, 0.3)', // blue
        'rgba(0, 0, 0, 0.3)', // black
        'rgba(0, 180, 180, 0.75)', // cyan
        'rgba(68, 163, 247, 0.5)', // teal
        'rgba(155, 155, 155, 0.5)', // grey
      ];
      return palette[Math.floor(Math.random() * palette.length)];
    }
    function initDrops() {
      drops = [];
      numSentences = getNumSentences();
      for (let i = 0; i < numSentences; i++) {
        const x = Math.random() * (width - maxFontSize * 2);
        const y = Math.random() * height - Math.random() * height;
        const quoteIdx = Math.floor(Math.random() * sciFiQuotes.length);
        // Assign font size randomly in range
        const fontSize = minFontSize + Math.random() * (maxFontSize - minFontSize);
        // Make speed inversely proportional to font size (bigger text flows slower)
        // You can tweak the multiplier for desired effect
        const speed = 0.3 + (maxFontSize - fontSize) * 0.15;
        const color = randomColor();
        drops.push({ x, y, quoteIdx, speed, fontSize, color });
      }
    }
    initDrops();

    function isAsian(text) {
      // Returns true if the text contains CJK characters
      return /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uff00-\uffef]/.test(text);
    }

    function draw() {
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      for (let i = 0; i < drops.length; i++) {
        const drop = drops[i];
        const quote = sciFiQuotes[drop.quoteIdx];
        if (!isAsian(quote)) {
          // English: rotate 90deg, flow vertically
          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', drop.x);
          text.setAttribute('y', drop.y);
          text.setAttribute('font-size', drop.fontSize);
          text.setAttribute('fill', drop.color);
          // text.setAttribute('transparency', drop.color[1]);
          text.setAttribute('font-family', 'monospace');
          text.setAttribute('transform', `rotate(90 ${drop.x} ${drop.y})`);
          text.textContent = quote;
          svg.appendChild(text);
        } else {
          // Asian: render vertically, upright characters, flow vertically
          for (let j = 0; j < quote.length; j++) {
            const ch = quote[j];
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', drop.x);
            text.setAttribute('y', drop.y + j * drop.fontSize);
            text.setAttribute('font-size', drop.fontSize);
            text.setAttribute('fill', drop.color);
            // text.setAttribute('transparency', drop.color[1]);
            text.setAttribute('font-family', 'monospace');
            text.textContent = ch;
            svg.appendChild(text);
          }
        }
        drop.y += drop.speed;
        // For Asian, estimate height as fontSize * quote.length
        // For English, just use fontSize
        const quoteHeight = isAsian(quote) ? drop.fontSize * quote.length : drop.fontSize;
        if (drop.y - quoteHeight > height) {
          drop.x = Math.random() * (width - maxFontSize * 2);
          drop.y = -Math.random() * height;
          drop.quoteIdx = Math.floor(Math.random() * sciFiQuotes.length);
          // Assign font size randomly in range
          drop.fontSize = minFontSize + Math.random() * (maxFontSize - minFontSize);
          // Make speed inversely proportional to font size (bigger text flows slower)
          drop.speed = 3 + (maxFontSize * 1.5 - drop.fontSize) * 0.25 + Math.random() * 2;
          drop.color = randomColor();
        }
      }
    }

    setInterval(draw, 50);

    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
      initDrops();
    });
    // --- Also re-init drops on orientation/layout change ---
    window.addEventListener('orientationchange', initDrops);
    // Listen for class changes (portrait/landscape)
    const observer = new MutationObserver(() => {
      initDrops();
    });
    observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });

    // Fetch and extract sentences from sci-fi-texts/ files
    async function fetchSentences(file, lang) {
      const response = await fetch(`sci-fi-texts/${file}`);
      const text = await response.text();
      // Each line is a sentence; filter out empty lines
      return text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    }

    // --- Dynamically load and randomize sci-fi sentences from all files in sci-fi-texts/ ---
    async function getAllSciFiTextFiles() {
      // Hardcoded list based on your directory (update as needed)
      return [
        '衛斯理 頭髮.txt',
        'わたしを離さないで.txt',
        'Neuromancer.txt',
        'Do_Androids_Dream_of_Electric_Sheep.txt',
        // '1984.txt',
        // 'HG Wells - War of the Worlds.txt'
        // Add more filenames here as you add them to sci-fi-texts/
      ];
    }

    async function loadSciFiQuotes() {
      const files = await getAllSciFiTextFiles();
      // Shuffle the files array for randomness
      for (let i = files.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [files[i], files[j]] = [files[j], files[i]];
      }
      let allSentences = [];
      for (const file of files) {
        let lang = 'english';
        if (/\.txt$/.test(file)) {
          if (/^[\u4e00-\u9fff]/.test(file) || file.includes('衛斯理')) lang = 'chinese';
          else if (/^[\u3040-\u30ff]/.test(file) || file.includes('わたし')) lang = 'japanese';
        }
        const sentences = await fetchSentences(file, lang);
        allSentences.push(...sentences);
      }
      // Shuffle all sentences for randomness
      for (let i = allSentences.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [allSentences[i], allSentences[j]] = [allSentences[j], allSentences[i]];
      }
      sciFiQuotes.length = 0;
      sciFiQuotes.push(...allSentences);
      initDrops();
    }

    loadSciFiQuotes();
  </script>
  <audio id="bg-music" loop style="display:none">
    <source src="sounds/futuristic.ogg" type="audio/ogg">
    <source src="sounds/futuristic.mp3" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>

  <script>
  // --- Play background music file after user interaction ---
  const audio = document.getElementById('bg-music');
  function startMusicOnce() {
    audio.play();
    window.removeEventListener('click', startMusicOnce);
  }
  window.addEventListener('click', startMusicOnce);
  </script>

  <script>
    // --- Language switch logic for foreground text ---
    const cnText = `我们的目标是<br>建立未来世界的民主<br>和人工智能服务<br>消除种族歧视和极权主义<br>我们的核心价值是<br>自由、真理、平等`;
    const twText = `我們的目標是<br>建立未來世界的民主<br>和人工智能服務<br>消除種族歧視和極權主義<br>我們的核心價值是<br>自由、真理、平等`;
    const enText = `Our goal is to build<br>democracy for the future world<br>with AI services<br>eliminating racism and totalitarianism<br>Our core values are<br>freedom, truth, and equality`;
    let currentLang = 'en';
    const fgTextDiv = document.getElementById('foreground-text');
    const langBtn = document.getElementById('lang-switch');
    langBtn.addEventListener('click', switchLang);
    function switchLang() {
      if (currentLang === 'en') {
        fgTextDiv.innerHTML = cnText;
        fgTextDiv.style.fontSize = '4em';
        fgTextDiv.style.fontFamily = 'Alimama';
        langBtn.textContent = '繁體';
        currentLang = 'cn';
      } else if (currentLang === 'cn') {
        fgTextDiv.innerHTML = twText;
        fgTextDiv.style.fontSize = '4em';
        fgTextDiv.style.fontFamily = '';
        langBtn.textContent = 'English';
        currentLang = 'tw';
      } else {
        fgTextDiv.innerHTML = enText;
        fgTextDiv.style.fontSize = '2.5em';
        langBtn.textContent = '简体';
        fgTextDiv.style.fontFamily = '';
        currentLang = 'en';
      }
    }
    // --- Detect country by IP and set initial language ---
    (async function detectCountryAndSetLang() {
      try {
        const resp = await fetch('https://ipapi.co/json/');
        if (resp.ok) {
          const data = await resp.json();
          // Simplified: CN, SG, MO, MY; Traditional: HK, TW
          const simpCountries = ['CN', 'SG', 'MO', 'MY'];
          const tradCountries = ['HK', 'TW'];
          if (simpCountries.includes(data.country)) {
            currentLang = 'cn';
            fgTextDiv.innerHTML = cnText;
            fgTextDiv.style.fontSize = '4em';
            fgTextDiv.style.fontFamily = 'Alimama';
            langBtn.textContent = '繁體';
          } else if (tradCountries.includes(data.country)) {
            currentLang = 'tw';
            fgTextDiv.innerHTML = twText;
            fgTextDiv.style.fontSize = '4em';
            fgTextDiv.style.fontFamily = '';
            langBtn.textContent = 'English';
          } else {
            currentLang = 'en';
            fgTextDiv.innerHTML = enText;
            fgTextDiv.style.fontSize = '2.5em';
            fgTextDiv.style.fontFamily = '';
            langBtn.textContent = '简体';
          }
          return;
        }
      } catch (e) {}
      // fallback
      switchLang();
    })();
    switchLang(); // Initialize with Simplified Chinese text
  </script>

  <script>
    // --- Layout adjustment for orientation ---
    function updateLayoutForOrientation() {
      // Use screen.orientation API if available, fallback to window.innerWidth/innerHeight
      let isPortrait = false;
      if (window.screen && window.screen.orientation && window.screen.orientation.type) {
        isPortrait = window.screen.orientation.type.startsWith('portrait');
      } else {
        isPortrait = window.innerHeight > window.innerWidth;
      }
      document.body.classList.toggle('portrait', isPortrait);
      document.body.classList.toggle('landscape', !isPortrait);
    }
    window.addEventListener('resize', updateLayoutForOrientation);
    window.addEventListener('orientationchange', updateLayoutForOrientation);
    updateLayoutForOrientation();
  </script>

</body>
</html>
