<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Node Page</title>
  <style>
    :root {
      --in-progress: #FCC;
      --finished: #CFC;
      --paused: #CCC;
      --research: #FF0;
    }
    
    body { 
      font-family: sans-serif; 
      background: #EEE; 
      color: #333; 
      margin: 2em; 
    }
    
    .container { 
      background: #EEE; 
      border: 2px solid #888; 
      border-radius: 10px; 
      padding: 20px; 
      max-width: 90%; 
      margin: auto;
    }
    
    h1 { 
      color: #333; 
      margin-top: 0;
      font-size: 24px;
    }
    
    .node-id { 
      color: #666; 
      font-size: 16px; 
      margin-bottom: 15px;
    }
    
    .section { 
      margin-bottom: 15px; 
    }
    
    label { 
      font-size: 16px;
      display: block;
      margin-bottom: 5px;
    }
    
    .colorKey {
      color: Black;
      font-size: 16px;
      border-radius: 8px;
      padding: 4px;
      display: inline;
    }
    
    label[for='in-progress'] { background-color: var(--in-progress); }
    label[for='finished'] { background-color: var(--finished); }
    label[for='paused'] { background-color: var(--paused); }
    label[for='research'] { background-color: var(--research); }
    
    input[type='text'], textarea, input[type='number'] {
      font-size: 16px;
      width: 95%;
      padding: 4px;
      border: 1px solid #888;
      border-radius: 4px;
    }
    
    input[type='radio'] {
      margin-right: 8px;
      margin-bottom: 16px;
      accent-color: Black;
    }
    
    input:disabled, label[disabled] {
      color: #888;
      background-color: #DDD;
    }
    
    textarea {
      resize: vertical;
    }
    
    button {
      background: #CFF;
      border: 1px solid #888;
      border-radius: 4px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 16px;
    }
    
    button:hover {
      background: #AEE;
    }
    
    .vote-section {
      margin-top: 15px;
    }
    
    .vote-button {
      float: right;
      margin-top: 5px;
      margin-right: 20px;
    }
    
    .authors-section {
      clear: both;
      margin-top: 10px;
    }
    
    .back-link {
      display: inline-block;
      margin-top: 2em;
      color: #666;
      text-decoration: none;
    }
    
    .back-link:hover {
      color: #333;
    }
    
    /* Voting styles */
    .voting-container {
      padding: 5px;
      border: 1px solid #888;
      border-radius: 4px;
      background: white;
    }
    
    .slidecontainer {
      width: 100%;
      height: 35px;
    }

    .slider {
      width: 76%;
      display: inline-block;
    }

    .name {
      color: Blue;
      font-size: 18px;
      display: inline-block;
      margin-right: 5px;
      width: 15%;
      text-align: center;
    }

    .score {
      font-size: 16px;
      display: inline-block;
      margin-left: 5px;
      width: 5%;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="node-title">Node: Loading...</h1>
    <div class="node-id" id="node-id"></div>

      <div class="section">
        <label>Task name (English):</label>
        <input type="text" id="labelEN" name="labelEN">
      </div>

      <div class="section">
        <label>工作名称（中文）：</label>
        <input type="text" id="labelZH" name="labelZH">
      </div>

    <form id="node-form">
      <div class="section">
        <label>Status:</label>
        <input type="radio" id="in-progress" name="status" value="in-progress">
        <label class="colorKey" for="in-progress">in progress</label><br>
        <input type="radio" id="finished" name="status" value="finished">
        <label class="colorKey" for="finished">finished</label><br>
        <input type="radio" id="paused" name="status" value="paused">
        <label class="colorKey" for="paused">paused</label><br>
        <input type="radio" id="research" name="status" value="research">
        <label class="colorKey" for="research">research area</label><br>
      </div>

      <div class="section">
        <label>Edge label:</label>
        <input type="text" id="edgeLabel" name="edgeLabel">
      </div>

      <div class="section">
        <label>Comments:</label>
        <textarea id="details" name="details" rows="8"></textarea>
      </div>

      <div class="section">
        <label disabled>Expected tokens</label>
        <input type="number" id="expTokens" name="expTokens" style="width:9em;" disabled>
      </div>
      
      <div class="section">
        <label disabled>Expected days</label>
        <input type="number" id="expTime" name="expTime" style="width:4em;" disabled>
      </div>
      
      <div class="section">
        <label disabled>Expected # workers</label>
        <input type="number" id="expWorkers" name="expWorkers" style="width:4em;" disabled>
      </div>

      <div class="section vote-section">
        <label style="display:inline-block; margin-top:5px;">Authors:</label>
        <div class="authors-section">
          <input type="text" id="authors" name="authors" placeholder="comma separated">
        </div>
      </div>

      <!-- Voting section -->
      <div class="section">
        <label>Voting:</label>
        <div class="voting-container">
          <div class="slidecontainer">
            <p class="name">Claris</p>
            <pre class="score">0</pre>
            <input type="range" min="0" max="1000" value="0" class="slider">
          </div>

          <div class="slidecontainer">
            <p class="name">Abeer</p>
            <pre class="score">0</pre>
            <input type="range" min="0" max="1000" value="0" class="slider">
          </div>

          <div class="slidecontainer">
            <p class="name">Pete</p>
            <pre class="score">0</pre>
            <input type="range" min="0" max="1000" value="0" class="slider">
          </div>

          <div class="slidecontainer">
            <p class="name">Eric</p>
            <pre class="score">0</pre>
            <input type="range" min="0" max="1000" value="0" class="slider">
          </div>

          <div class="slidecontainer">
            <p class="name">YKY</p>
            <pre class="score">0</pre>
            <input type="range" min="0" max="1000" value="0" class="slider">
          </div>

          <div class="slidecontainer">
            <p class="name">Roger</p>
            <pre class="score">0</pre>
            <input type="range" min="0" max="1000" value="0" class="slider">
          </div>

          <div class="slidecontainer">
            <p class="name">Total</p>
            <pre class="score" id="total">0</pre>
          </div>
          <br>
        </div>
      </div>

      <button type="submit" style="margin-top:1em;">Save</button>
    </form>
    
    <a href="project-graph.html" class="back-link">&larr; Back to Project Graph</a>
  </div>
  <script>
    // Get node id from URL
    const params = new URLSearchParams(window.location.search);
    const nodeId = params.get('id');
    document.getElementById('node-id').textContent = 'Node ID: ' + nodeId;
    
    // Load node data from localStorage (if available)
    let nodeData = null;
    let map = null;
    try {
      map = JSON.parse(localStorage.getItem('projectMapRoot'));
      function findNode(node, id) {
        if (!node) return null;
        if (String(node.id) === String(id)) return node;
        if (node.children) {
          for (const child of node.children) {
            const found = findNode(child, id);
            if (found) return found;
          }
        }
        return null;
      }
      nodeData = findNode(map, nodeId);
    } catch {}
    
    function setField(id, value) {
      const el = document.getElementById(id);
      if (el) el.value = value || '';
    }
    
    if (nodeData) {
      // Set the node title
      const nodeNameEN = nodeData.labelEN || nodeData.label || `Node ${nodeId}`;
      document.getElementById('node-title').innerHTML = `<span style="color: #666; font-weight: normal; font-size: 16px;">Node:</span> ${nodeNameEN}`;
      
      // Set status radio buttons
      if (nodeData.status) {
        const statusRadio = document.getElementById(nodeData.status);
        if (statusRadio) statusRadio.checked = true;
      } else {
        // Default to in-progress if no status
        const defaultRadio = document.getElementById('in-progress');
        if (defaultRadio) defaultRadio.checked = true;
      }
      
      setField('labelEN', nodeData.labelEN || nodeData.label || '');
      setField('labelZH', nodeData.labelZH || '');
      setField('edgeLabel', nodeData.edgeLabel || '');
      setField('details', nodeData.details || '');
      setField('expTokens', nodeData.expTokens || '');
      setField('expTime', nodeData.expTime || '');
      setField('expWorkers', nodeData.expWorkers || '');
      setField('authors', nodeData.authors ? nodeData.authors.join(', ') : '');
    } else {
      // Set default title when no node data found
      document.getElementById('node-title').innerHTML = `<span style="color: #666; font-weight: normal; font-size: 16px;">Node:</span> ${nodeId || 'Unknown'}`;
      
      // Default to in-progress if no node data found
      const defaultRadio = document.getElementById('in-progress');
      if (defaultRadio) defaultRadio.checked = true;
    }
    
    // Handle form submission
    document.getElementById('node-form').onsubmit = function(e) {
      e.preventDefault();
      if (!nodeData) return;
      
      // Update nodeData from form
      const checkedRadio = document.querySelector('input[name="status"]:checked');
      if (checkedRadio) nodeData.status = checkedRadio.value;
      
      nodeData.labelEN = document.getElementById('labelEN').value;
      nodeData.label = nodeData.labelEN;
      nodeData.labelZH = document.getElementById('labelZH').value;
      nodeData.edgeLabel = document.getElementById('edgeLabel').value;
      nodeData.details = document.getElementById('details').value;
      nodeData.expTokens = document.getElementById('expTokens').value;
      nodeData.expTime = document.getElementById('expTime').value;
      nodeData.expWorkers = document.getElementById('expWorkers').value;
      nodeData.authors = document.getElementById('authors').value.split(',').map(s => s.trim()).filter(Boolean);
      
      // Save back to localStorage
      localStorage.setItem('projectMapRoot', JSON.stringify(map));
      alert('Node updated! (Note: changes are local until you save the map)');
    };
    
    // Initialize voting sliders
    function initializeVoting() {
      const sliders = document.getElementsByClassName("slider");
      const outputs = document.getElementsByClassName("score");
      
      var scores = [];
      const n = sliders.length;
      
      // Initialize sliders values
      if (!window.votes || window.votes.length == 0) {
        window.votes = new Array();
        for (let j = 0; j < n; ++j) {
          scores[j] = window.votes[j] = 1000.0 / n;
          sliders[j].value = Math.round(scores[j]);
          outputs[j].innerHTML = (scores[j] / 10.0).toFixed(2);
        }
      } else {
        for (let j = 0; j < n; ++j) {
          sliders[j].value = window.votes[j];
          scores[j] = window.votes[j];
          outputs[j].innerHTML = (scores[j] / 10.0).toFixed(2);
        }
      }
      
      var total = 0.0;
      for (const score of scores) {
        total += score;
      }
      document.getElementById("total").innerHTML = (total / 10.0).toFixed(2);
      
      // Add event listeners to sliders
      [...sliders].forEach(function (slider, k) {
        slider.addEventListener("input", function() {
          scores[k] = window.votes[k] = parseFloat(this.value);
          outputs[k].innerHTML = parseFloat(scores[k] / 10.0);
          
          // Calculate surplus value
          var subtotal = 0;
          for (const score of scores) {
            subtotal += score;
          }
          var surplus = 1000.0 - subtotal;
          var adjustment = surplus / (n - 1);
          
          // Adjust other sliders proportionally
          for (let j = 0; j < n; ++j) {
            if (j != k) {
              scores[j] = window.votes[j] += adjustment;
              if (scores[j] < 0) scores[j] = window.votes[j] = 0;
              sliders[j].value = Math.round(scores[j]);
              outputs[j].innerHTML = (scores[j] / 10.0).toFixed(2);
            }
          }
          
          // Update total
          var newTotal = 0.0;
          for (const score of scores) {
            newTotal += score;
          }
          document.getElementById("total").innerHTML = (newTotal / 10.0).toFixed(2);
        });
      });
    }
    
    // Initialize voting when page loads
    initializeVoting();
  </script>
</body>
</html>
