<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Node Page</title>
  <style>
    body { font-family: sans-serif; background: #f7fafd; color: #333; margin: 2em; }
    .container { background: #fff8e1; border: 2px solid #b77c00; border-radius: 10px; padding: 2em; max-width: 600px; margin: auto; }
    h1 { color: #7c4c00; }
    .node-id { color: #b77c00; font-size: 1.2em; }
    .section { margin-bottom: 1em; }
    .field-label { font-weight: bold; }
    .value-box { background: #fff3e0; padding: 0.5em; border-radius: 5px; display: inline-block; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Node Details</h1>
    <div class="node-id" id="node-id"></div>
    <form id="node-form">
      <div class="section"><span class="field-label">Status:</span>
        <label><input type="radio" name="status" value="in-progress"> in progress</label>
        <label><input type="radio" name="status" value="finished"> finished</label>
        <label><input type="radio" name="status" value="paused"> paused</label>
        <label><input type="radio" name="status" value="research"> research</label>
      </div>
      <div class="section"><span class="field-label">Task Name (EN):</span>
        <input id="labelEN" name="labelEN" class="value-box" type="text"></div>
      <div class="section"><span class="field-label">工作名称（中文）:</span>
        <input id="labelZH" name="labelZH" class="value-box" type="text"></div>
      <div class="section"><span class="field-label">Edge Label:</span>
        <input id="edgeLabel" name="edgeLabel" class="value-box" type="text"></div>
      <div class="section"><span class="field-label">Details:</span>
        <textarea id="details" name="details" class="value-box" rows="5"></textarea></div>
      <div class="section"><span class="field-label">Expected tokens:</span>
        <input id="expTokens" name="expTokens" class="value-box" type="number"></div>
      <div class="section"><span class="field-label">Expected days:</span>
        <input id="expTime" name="expTime" class="value-box" type="number"></div>
      <div class="section"><span class="field-label">Expected # workers:</span>
        <input id="expWorkers" name="expWorkers" class="value-box" type="number"></div>
      <div class="section"><span class="field-label">Authors (comma separated):</span>
        <input id="authors" name="authors" class="value-box" type="text"></div>
      <button type="submit" style="margin-top:1em;background:#b77c00;color:#fff;border:none;border-radius:6px;padding:0.5em 1.2em;font-weight:bold;">Save</button>
    </form>
    <a href="project-map.html" style="display:inline-block;margin-top:2em;color:#b77c00;">&larr; Back to Project Map</a>
  </div>
  <script>
    // Get node id from URL
    const params = new URLSearchParams(window.location.search);
    const nodeId = params.get('id');
    document.getElementById('node-id').textContent = 'Node ID: ' + nodeId;
    // Load node data from localStorage (if available)
    let nodeData = null;
    let map = null;
    try {
      map = JSON.parse(localStorage.getItem('projectMapRoot'));
      function findNode(node, id) {
        if (!node) return null;
        if (String(node.id) === String(id)) return node;
        if (node.children) {
          for (const child of node.children) {
            const found = findNode(child, id);
            if (found) return found;
          }
        }
        return null;
      }
      nodeData = findNode(map, nodeId);
    } catch {}
    function setField(id, value) {
      const el = document.getElementById(id);
      if (el) el.value = value || '';
    }
    if (nodeData) {
      if (nodeData.status) {
        const radios = document.querySelectorAll('input[name="status"]');
        radios.forEach(r => { r.checked = (r.value === nodeData.status); });
      }
      setField('labelEN', nodeData.labelEN || nodeData.label || '');
      setField('labelZH', nodeData.labelZH || '');
      setField('edgeLabel', nodeData.edgeLabel || '');
      setField('details', nodeData.details || '');
      setField('expTokens', nodeData.expTokens || '');
      setField('expTime', nodeData.expTime || '');
      setField('expWorkers', nodeData.expWorkers || '');
      setField('authors', nodeData.authors ? nodeData.authors.join(', ') : '');
    }
    document.getElementById('node-form').onsubmit = function(e) {
      e.preventDefault();
      if (!nodeData) return;
      // Update nodeData from form
      const radios = document.querySelectorAll('input[name="status"]');
      radios.forEach(r => { if (r.checked) nodeData.status = r.value; });
      nodeData.labelEN = document.getElementById('labelEN').value;
      nodeData.label = nodeData.labelEN;
      nodeData.labelZH = document.getElementById('labelZH').value;
      nodeData.edgeLabel = document.getElementById('edgeLabel').value;
      nodeData.details = document.getElementById('details').value;
      nodeData.expTokens = document.getElementById('expTokens').value;
      nodeData.expTime = document.getElementById('expTime').value;
      nodeData.expWorkers = document.getElementById('expWorkers').value;
      nodeData.authors = document.getElementById('authors').value.split(',').map(s => s.trim()).filter(Boolean);
      // Save back to localStorage
      localStorage.setItem('projectMapRoot', JSON.stringify(map));
      alert('Node updated! (Note: changes are local until you save the map)');
    };
  </script>
</body>
</html>
