<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Node Page</title>
  <link rel="stylesheet" href="css/node-page.css">
</head>
<body>
  <div class="container">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <h1 id="node-title" style="margin:0;">Node: Loading...</h1>
      <form id="node-form" style="margin:0;">
        <button type="submit" id="save-btn" style="margin-left:1em; font-size:16px;">Save</button>
      </form>
    </div>
    <div class="node-id" id="node-id"></div>
    
      <div class="section">
        <label>Task name (English):</label>
        <input type="text" id="labelEN" name="labelEN">
      </div>

      <div class="section" id="zh-section">
        <label>工作名称（中文）：</label>
        <input type="text" id="labelZH" name="labelZH">
      </div>

      <div class="section">
        <label>Status:</label>
        <input type="radio" id="in-progress" name="status" value="in-progress">
        <label class="colorKey" for="in-progress">in progress</label><br>
        <input type="radio" id="finished" name="status" value="finished">
        <label class="colorKey" for="finished">finished</label><br>
        <input type="radio" id="paused" name="status" value="paused">
        <label class="colorKey" for="paused">paused</label><br>
        <input type="radio" id="research" name="status" value="research">
        <label class="colorKey" for="research">research area</label><br>
      </div>

      <div class="section" style="display:flex; align-items:flex-end; gap:18px;">
        <div style="flex:1; min-width:120px;">
          <label>Expected tokens</label>
          <input type="number" id="expTokens" name="expTokens" style="width:100%; min-width:6em;">
        </div>
        <div style="flex:1; min-width:100px;">
          <label>Expected days</label>
          <input type="number" id="expTime" name="expTime" style="width:100%; min-width:4em;">
        </div>
        <div style="flex:1; min-width:120px;">
          <label>Expected # workers</label>
          <input type="number" id="expWorkers" name="expWorkers" style="width:100%; min-width:4em;">
        </div>
      </div>
      <div class="section vote-section">
        <div style="display:flex; align-items:center; gap:10px;">
          <label style="display:inline-block; margin-top:5px; margin-bottom:0;">Authors:</label>
          <button type="button" class="add-author-btn" onclick="showUserSelector()">Add Author</button>
        </div>
        <div class="authors-section" style="margin-top:6px;">
          <div class="authors-list" id="authors-list">
            <!-- Authors will be displayed here as tags -->
          </div>
        </div>
      </div>
      <div class="section">
        <label>Voting:</label>
        <div class="voting-container" id="voting-container">
          <!-- Voting sliders will be populated dynamically based on authors -->
        </div>
      </div>

    </form>
    <!-- Move Chat UI here, just above the back link -->
    <div class="section">
      <label><b>Chat about this node:</b></label>
      <div id="chat-container" style="border:1px solid #aaa; background:#fff; border-radius:6px; padding:10px; max-height:300px; overflow-y:auto; margin-bottom:8px;"></div>
      <div style="display:flex; gap:6px;">
        <input id="chat-input" type="text" placeholder="Type a message..." style="flex:1; font-size:16px; padding:6px; border-radius:4px; border:1px solid #888;">
        <button type="button" id="chat-send-btn">Send</button>
      </div>
    </div>
    <a href="project-graph.html" class="back-link">&larr; Back to Project Graph</a>
  </div>

  <!-- User selector modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="hideUserSelector()"></div>
  <div class="user-selector" id="user-selector">
    <button class="close-btn" onclick="hideUserSelector()">×</button>
    <h3>Select User to Add as Author</h3>
    <div id="users-list">
      <!-- Users will be loaded here -->
    </div>
  </div>

  <script src="js/node-page.js"></script>
</body>
</html>
