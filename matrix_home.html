<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Matrix Rain Home</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #a3e4f5;
      /* background: #d8f7ff; */
      overflow: hidden;
    }
    body {
      width: 100vw;
      height: 100vh;
    }
    svg {
      display: block;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0; left: 0;
    }
  </style>
</head>
<body>
  <svg id="matrix-svg"></svg>
  <script>
    // Katakana Unicode range: 0x30A0 - 0x30FF
    function randomKatakana() {
      const code = 0x30A0 + Math.floor(Math.random() * (0x30FF - 0x30A0));
      return String.fromCharCode(code);
    }

    const svg = document.getElementById('matrix-svg');
    let width = window.innerWidth;
    let height = window.innerHeight;
    svg.setAttribute('width', width);
    svg.setAttribute('height', height);

    const fontSize = 24;
    const columns = Math.floor(width / fontSize);
    const drops = Array(columns).fill(0);

    function draw() {
      // Clear SVG
      while (svg.firstChild) svg.removeChild(svg.firstChild);

      for (let i = 0; i < columns; i++) {
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        text.setAttribute('x', x);
        text.setAttribute('y', y);
        text.setAttribute('font-size', fontSize);
        text.setAttribute('fill', '#fff');
        text.setAttribute('font-family', 'monospace');
        text.textContent = randomKatakana();
        svg.appendChild(text);

        // Randomly reset drop to top
        if (y > height && Math.random() > 0.975) {
          drops[i] = 0;
        } else {
          drops[i]++;
        }
      }
    }

    setInterval(draw, 50);

    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      svg.setAttribute('width', width);
      svg.setAttribute('height', height);
    });
  </script>
</body>
</html>
