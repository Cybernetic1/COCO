<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Project Graph (Tree UI)</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .tree-node {
      display: inline-block;
      margin: 0.5em;
      padding: 0.5em 1em;
      background: #fff8e1;
      border: 1.5px solid #b77c00;
      border-radius: 8px;
      cursor: pointer;
      position: relative;
    }
    .tree-children {
      margin-left: 2em;
      display: block;
    }
    #node-modal {
      display: none;
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      border: 2px solid #b77c00;
      border-radius: 12px;
      box-shadow: 0 2px 16px #f9e6b3;
      padding: 2em 2em 1.5em 2em;
      z-index: 1000;
      min-width: 300px;
    }
    #node-modal input {
      width: 90%;
      margin-bottom: 1em;
      padding: 0.4em;
      border-radius: 6px;
      border: 1px solid #b77c00;
    }
    #modal-overlay {
      display: none;
      position: fixed;
      left: 0; top: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.2);
      z-index: 999;
    }
  </style>
  <script src="js/project-graph.js" defer></script>
</head>
<body>
  <h1 style="text-align:center;color:#7c4c00;">Project Graph (Tree UI)</h1>
  <div id="tree-container" style="margin:2em auto;max-width:900px;"></div>
  <div id="modal-overlay"></div>
  <div id="node-modal">
    <h2>Edit Node</h2>
    <label>Label:<br><input id="modal-node-label" type="text"></label><br>
    <button id="modal-save-btn">Save</button>
    <button id="modal-cancel-btn">Cancel</button>
  </div>
</body>
</html>
