<!DOCTYPE html>
<html>
<head>
    <title>Test Save JSON API</title>
</head>
<body>
    <h1>Test Save JSON API</h1>
    <button onclick="testSaveJSON()">Test /saveJSON endpoint</button>
    <div id="result"></div>

    <script>
        async function testSaveJSON() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            // Create test data similar to project map structure
            const testData = {
                id: 0,
                labelEN: "Test Project",
                labelZH: "测试项目", 
                "project-name": "test-save",
                percentage: 100,
                children: [
                    {
                        id: 1,
                        labelEN: "Child Node 1",
                        labelZH: "子节点1",
                        percentage: 50,
                        children: []
                    },
                    {
                        id: 2, 
                        labelEN: "Child Node 2",
                        labelZH: "子节点2",
                        percentage: 30,
                        children: []
                    }
                ]
            };
            
            try {
                console.log('Testing /saveJSON endpoint...');
                const response = await fetch('/saveJSON', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        filename: 'test-save-api.json',
                        data: testData
                    })
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (response.ok) {
                    const result = await response.json();
                    console.log('Save result:', result);
                    resultDiv.innerHTML = `
                        <h3>✅ SUCCESS</h3>
                        <pre>${JSON.stringify(result, null, 2)}</pre>
                        <p>Check the project-maps/ directory for test-save-api.json</p>
                    `;
                } else {
                    const errorText = await response.text();
                    console.error('Error response:', errorText);
                    resultDiv.innerHTML = `
                        <h3>❌ ERROR</h3>
                        <p>Status: ${response.status} ${response.statusText}</p>
                        <pre>${errorText}</pre>
                    `;
                }
            } catch (error) {
                console.error('Fetch error:', error);
                resultDiv.innerHTML = `
                    <h3>❌ NETWORK ERROR</h3>
                    <p>${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
