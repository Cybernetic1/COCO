<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <title>World Political Alignment Map</title>
    <script src="js/mapdata.js"></script>
    <script src="js/worldmap.js"></script>
    <script src="js/map-paths.js"></script>
    <script src="js/map-logic.js"></script>
    <style>
      html, body {
        width: 100%;
		height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      body {
        width: 100%;
        height: 100%;
      }
      /* Legend for 5 colors */
      #color-legend {
        position: absolute;
        left: 20px;
        bottom: 20px;
        background: rgba(255,255,255,0.6);
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        padding: 12px 18px 12px 12px;
        font-family: Arial, sans-serif;
        font-size: 15px;
        z-index: 1000;
      }
      #color-legend .legend-row {
        display: flex;
        align-items: center;
        margin-bottom: 6px;
      }
      #color-legend .legend-color {
        width: 22px;
        height: 22px;
        border-radius: 4px;
        margin-right: 10px;
        border: 1px solid #bbb;
        box-sizing: border-box;
      }
      #color-legend .legend-label {
        white-space: nowrap;
      }
      #tt_sm_map, [id^="tt_sm_"] {
        white-space: normal !important;
        word-break: normal !important;
        overflow-wrap: break-word !important;
        max-width: 320px !important;
      }
    </style>
  </head>
	<body>
		<div>
			<div style="display: flex; justify-content: center; align-items: center; margin-bottom: 10px;">
        <h1 style="text-align: center; margin: 0 20px 0 0;">World Political Alignment</h1>
        <button id="credits-btn" style="vertical-align: middle;">Credits</button>
      </div>
      <div id="credits-modal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.9); z-index:2000; justify-content:center; align-items:center;">
        <div id="credits-content" style="background:white; opacity:0.9; border-radius:12px; max-width:800px; max-height:80vh; margin:auto; padding:32px; overflow:auto; position:relative;">
          <button id="close-credits" style="position:absolute; top:12px; right:16px; font-size:1.5em; background:none; border:none; cursor:pointer;">&times;</button>
          <!-- Fill in your credits text here -->
        </div>
      </div>
      <script>
        document.getElementById('credits-btn').onclick = function() {
          document.getElementById('credits-modal').style.display = 'flex';
        };
        document.getElementById('close-credits').onclick = function() {
          document.getElementById('credits-modal').style.display = 'none';
        };
        // Optional: close modal when clicking outside content
        document.getElementById('credits-modal').onclick = function(e) {
          if (e.target === this) this.style.display = 'none';
        };
      </script>
			<div style="max-width: 100%; max-height: 100%; position: relative;">
				<div id="map"></div>
			</div>
		</div>
    <!-- Legend for 5 colors -->
    <div id="color-legend">
      <div class="legend-row">
		  <span class="legend-color" style="background:blue"></span>
		  <span class="legend-label">Western or USA&emsp;</span>
		  <span class="legend-color" style="background:#5af"></span>
		  <span class="legend-label">West-leaning</span>
      </div>
      <div class="legend-row">
		  <span class="legend-color" style="background:red"></span>
		  <span class="legend-label">pro-China or Russia&emsp;</span>
		  <span class="legend-color" style="background:pink"></span>
		  <span class="legend-label">China-leaning</span>
	  </div>
      <div class="legend-row">
		  <span class="legend-color" style="background:green"></span>
		  <span class="legend-label">anti-US Islamic&emsp;</span>
		  <span class="legend-color" style="background:#0f0"></span>
		  <span class="legend-label">pro-US Islamic&emsp;</span>
		  <span class="legend-color" style="background:#cfc"></span>
		  <span class="legend-label">neutral/complex Islamic</span>
      </div>
      <div class="legend-row"><span class="legend-color" style="background:cyan"></span><span class="legend-label">Neutral</span></div>
    </div>
	</body>
</html>
