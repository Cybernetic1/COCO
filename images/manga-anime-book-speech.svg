<!-- Manga/Anime Book Page with Cartoon Character and Speech Balloon (200x250px) -->
<svg width="200" height="250" viewBox="0 0 200 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Book base -->
  <rect x="20" y="40" width="160" height="190" rx="18" fill="#fffbe6" stroke="#7c4a03" stroke-width="4"/>
  <!-- Book spine shadow -->
  <rect x="20" y="40" width="32" height="190" rx="12" fill="#f9e6b3"/>
  <!-- Manga panel frame -->
  <rect x="45" y="65" width="110" height="80" rx="8" fill="#fff" stroke="#b77c00" stroke-width="2"/>
  <!-- Cartoon character (simple chibi style) -->
  <ellipse cx="100" cy="110" rx="22" ry="24" fill="#fff" stroke="#7c4a03" stroke-width="2"/>
  <!-- Face -->
  <ellipse cx="92" cy="112" rx="3.5" ry="5" fill="#fff" stroke="#7c4a03" stroke-width="1.5"/>
  <ellipse cx="108" cy="112" rx="3.5" ry="5" fill="#fff" stroke="#7c4a03" stroke-width="1.5"/>
  <ellipse cx="92" cy="114" rx="1.5" ry="2" fill="#7c4a03"/>
  <ellipse cx="108" cy="114" rx="1.5" ry="2" fill="#7c4a03"/>
  <ellipse cx="100" cy="120" rx="6" ry="2" fill="#f9d776"/>
  <path d="M95 124 Q100 128 105 124" stroke="#b77c00" stroke-width="1.5" fill="none"/>
  <!-- Hair -->
  <path d="M80 100 Q100 85 120 100 Q110 90 100 92 Q90 90 80 100 Z" fill="#b77c00"/>
  <!-- Body -->
  <rect x="92" y="128" width="16" height="18" rx="6" fill="#f9e6b3" stroke="#7c4a03" stroke-width="1.5"/>
  <!-- Arms -->
  <path d="M92 135 Q85 140 92 145" stroke="#7c4a03" stroke-width="1.5" fill="none"/>
  <path d="M108 135 Q115 140 108 145" stroke="#7c4a03" stroke-width="1.5" fill="none"/>
  <!-- Speech balloon -->
  <ellipse cx="150" cy="70" rx="28" ry="16" fill="#fff" stroke="#7c4a03" stroke-width="2"/>
  <path d="M140 82 Q145 90 120 110" stroke="#7c4a03" stroke-width="2" fill="none"/>
  <!-- Balloon text (stylized lines) -->
  <text x="137" y="72" font-size="9" font-family="Segoe UI, Arial, sans-serif" fill="#7c4a03">Let's</text>
  <text x="133" y="82" font-size="9" font-family="Segoe UI, Arial, sans-serif" fill="#7c4a03">collaborate!</text>
  <!-- Manga lines (book page) -->
  <line x1="40" y1="170" x2="170" y2="170" stroke="#b77c00" stroke-width="2"/>
  <line x1="40" y1="185" x2="170" y2="185" stroke="#b77c00" stroke-width="2"/>
  <line x1="40" y1="200" x2="170" y2="200" stroke="#b77c00" stroke-width="2"/>
</svg>
