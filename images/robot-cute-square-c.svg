<!-- Minimalistic Cute Robot: Square Head, No Mouth, 2 Dots Eyes, C-shaped Hands (200x250px) -->
<svg width="200" height="250" viewBox="0 0 200 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Head (square) -->
  <rect x="60" y="50" width="80" height="60" rx="16" fill="#fff" stroke="#7c4a03" stroke-width="3"/>
  <!-- Eyes (dots) -->
  <circle cx="85" cy="80" r="6" fill="#1aad19"/>
  <circle cx="115" cy="80" r="6" fill="#1aad19"/>
  <!-- Body -->
  <rect x="70" y="120" width="60" height="60" rx="20" fill="#f7fafd" stroke="#7c4a03" stroke-width="3"/>
  <!-- Arms (C-shape) -->
  <path d="M70 140 Q50 150 70 170" stroke="#7c4a03" stroke-width="5" fill="none"/>
  <path d="M130 140 Q150 150 130 170" stroke="#7c4a03" stroke-width="5" fill="none"/>
  <!-- Legs -->
  <rect x="82" y="180" width="10" height="28" rx="4" fill="#fff" stroke="#7c4a03" stroke-width="2"/>
  <rect x="108" y="180" width="10" height="28" rx="4" fill="#fff" stroke="#7c4a03" stroke-width="2"/>
</svg>
